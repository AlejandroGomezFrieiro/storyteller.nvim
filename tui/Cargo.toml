[package]
name = "storyteller-tui"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Keyboard-first cockpit for Storyteller writing projects (ratatui frontend)"

[dependencies]
ratatui = "0.30"
crossterm = "0.28"
anyhow = "1"
termprofile = { version = "0.2", features = ["ratatui", "convert"] }
unicode-width = "0.2"
storyteller-core = { git = "https://github.com/AlejandroGomezFrieiro/storyteller.git", tag = "v1.3.0" }

[[bin]]
name = "storyteller-tui"
path = "src/main.rs"

[dev-dependencies]
serde_json = "1"
