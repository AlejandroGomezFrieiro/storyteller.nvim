name: CI

on:
  push:
  pull_request:

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Enable Nix binary cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Build packages (plugin + TUI; buildRustPackage runs cargo tests)
        run: nix build .#default .#storyteller-tui

      - name: Rust fmt / clippy / tests
        run: |
          nix develop .#default --command bash -c '
            cd tui
            cargo fmt --check
            cargo clippy --all-targets -- -D warnings
            cargo test
          '

      - name: Lua tests + lint
        run: |
          nix develop .#default --command bash -c '
            nvim --headless -u NONE -l tests/storyteller_spec.lua
            stylua --check lua/ plugin/ tests/
            luacheck lua/ plugin/ tests/
          '
