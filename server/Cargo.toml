[package]
name = "storyteller-lsp"
version = "0.2.0"
edition = "2021"
description = "Prose-aware language server for Storyteller Markdown writing projects."

[[bin]]
name = "storyteller-lsp"
path = "src/main.rs"

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
walkdir = "2"
